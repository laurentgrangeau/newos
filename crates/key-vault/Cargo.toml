[package]
name = "newos-key-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["ml-dsa-87", "sha3"]
ml-dsa-87 = ["newos-crypto/ml-dsa-87"]
sha3 = ["newos-crypto/sha3"]

[dependencies]
ml-dsa = { version = "0.1", default-features = false, features = ["zeroize"] }
newos-abi = { workspace = true }
newos-crypto = { workspace = true, default-features = false, features = ["sha3", "ml-dsa-87"] }
newos-rng = { workspace = true }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[lints]
workspace = true
