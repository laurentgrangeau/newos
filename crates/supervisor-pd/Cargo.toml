[package]
name = "newos-supervisor-pd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["shell", "crypto-sha3", "net", "ipv4", "ipv6", "tcp", "udp", "icmp", "dns", "ssh", "worker-supervisor", "wdt"]
shell = ["dep:newos-shell-core"]
crypto-sha3 = ["newos-shell-core?/sha3"]
net = ["dep:newos-net"]
ipv4 = ["net", "newos-net/ipv4"]
ipv6 = ["net", "newos-net/ipv6"]
tcp = ["net", "newos-net/tcp"]
udp = ["net", "newos-net/udp"]
icmp = ["net", "newos-net/icmp"]
dns = ["net", "newos-net/dns"]
ssh = ["shell", "net", "tcp"]
worker-supervisor = []
wdt = ["dep:newos-wdt"]

[dependencies]
newos-abi = { workspace = true, default-features = false }
newos-net = { workspace = true, default-features = false, features = ["driver-gem", "driver-virtio"], optional = true }
newos-shell-core = { workspace = true, default-features = false, optional = true }
newos-user-rt = { workspace = true }
newos-wdt = { path = "../wdt", optional = true }

[lints]
workspace = true
