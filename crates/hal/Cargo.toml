[package]
name = "newos-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = [
    "arch-aarch64",
    "board-rpi5",
    "board-qemu-virt",
    "smp",
    "userspace",
    "acpi",
    "mmio-wdt",
    "mmio-gpio",
    "mmio-mbox",
    "mmio-thermal",
    "mmio-rp1-uart",
    "mmio-sdhci",
    "mmio-xhci",
    "mmio-v3d",
]
arch-aarch64 = []
board-rpi5 = []
board-qemu-virt = []
smp = ["newos-kernel-core/smp"]
userspace = ["newos-kernel-core/userspace"]
acpi = ["newos-kernel-core/acpi"]
mmio-wdt = []
mmio-gpio = []
mmio-mbox = []
mmio-thermal = []
mmio-rp1-uart = []
mmio-sdhci = []
mmio-xhci = []
mmio-v3d = []

[dependencies]
limine = { workspace = true }
newos-abi = { workspace = true, default-features = false }
newos-kernel-core = { workspace = true, default-features = false }

# Audited unsafe TCB: mirrors workspace lints except `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
