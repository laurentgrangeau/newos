[package]
name = "newos-user-rt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
newos-abi = { workspace = true, default-features = false }

# Audited EL0 syscall/entry TCB: mirrors workspace lints except `unsafe_code = "forbid"`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "warn"
