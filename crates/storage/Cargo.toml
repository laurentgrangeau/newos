[package]
name = "newos-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["pcie", "sdhci", "nvme", "caos-snapshot"]
pcie = []
sdhci = []
nvme = []
caos-snapshot = ["dep:newos-crypto"]

[dependencies]
newos-abi = { workspace = true, default-features = false }
newos-crypto = { workspace = true, default-features = false, features = ["sha3"], optional = true }

[lints]
workspace = true
