[package]
name = "newos-kernel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["userspace", "smp", "elf-attestation", "acpi", "sched-priority-rr"]
userspace = []
smp = []
elf-attestation = ["dep:newos-crypto"]
acpi = []
# Pluggable EL1 scheduler policies (compile-time selection):
sched-priority-rr = []
sched-round-robin = []
sched-fifo = []

[dependencies]
newos-abi = { workspace = true, default-features = false }
newos-crypto = { workspace = true, default-features = false, features = ["sha3"], optional = true }

[lints]
workspace = true
