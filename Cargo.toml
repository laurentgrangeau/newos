[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/crypto",
    "crates/abi",
    "crates/hal",
    "crates/kernel-core",
    "crates/kernel",
    "crates/shell-core",
    "crates/bench",
    "crates/user-rt",
    "crates/net",
    "crates/rng",
    "crates/wdt",
    "crates/gpio",
    "crates/board",
    "crates/storage",
    "crates/usb",
    "crates/gpu",
    "crates/ai",
    "crates/net-pd",
    "crates/key-vault",
    "crates/key-pd",
    "crates/ssh",
    "crates/ssh-pd",
    "crates/ssh-client",
    "crates/supervisor-pd",
    "crates/shell-pd",
    "crates/worker-pd",
    "tests",
]
default-members = [
    "xtask",
    "crates/crypto",
    "crates/abi",
    "crates/kernel-core",
    "crates/shell-core",
    "crates/bench",
    "crates/net",
    "crates/rng",
    "crates/wdt",
    "crates/gpio",
    "crates/board",
    "crates/storage",
    "crates/usb",
    "crates/gpu",
    "crates/ai",
    "crates/key-vault",
    "crates/ssh",
    "crates/ssh-client",
    "tests",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.10.0"

[workspace.dependencies]
limine = "0.6.5"
newos-abi = { path = "crates/abi" }
newos-crypto = { path = "crates/crypto" }
newos-hal = { path = "crates/hal" }
newos-kernel-core = { path = "crates/kernel-core" }
newos-key-vault = { path = "crates/key-vault" }
newos-net = { path = "crates/net" }
newos-rng = { path = "crates/rng" }
newos-shell-core = { path = "crates/shell-core" }
newos-ssh-proto = { path = "crates/ssh" }
newos-user-rt = { path = "crates/user-rt" }

[profile.dev.package.newos-crypto]
opt-level = 2

[profile.dev.package.ml-dsa]
opt-level = 2

[profile.dev.package.ml-kem]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "warn"
