[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/abi",
    "crates/hal",
    "crates/kernel-core",
    "crates/kernel",
    "crates/shell-core",
    "crates/bench",
    "crates/user-rt",
    "crates/net",
    "crates/init",
    "crates/worker",
]
default-members = [
    "xtask",
    "crates/abi",
    "crates/kernel-core",
    "crates/shell-core",
    "crates/bench",
    "crates/net",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
limine = "0.6.5"
newos-abi = { path = "crates/abi" }
newos-hal = { path = "crates/hal" }
newos-kernel-core = { path = "crates/kernel-core" }
newos-net = { path = "crates/net" }
newos-shell-core = { path = "crates/shell-core" }
newos-user-rt = { path = "crates/user-rt" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
